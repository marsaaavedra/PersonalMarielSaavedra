<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
</head>
<body>

    <div class="container">
        <h1 class="text-center mt-5 mb-5">APP API-REST PYTHON - FLASK - MONGODB</h1>
    </div>

    <div class="container">
        <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-2">

            <!-- Alta de producto -->
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="text-center">Alta producto</h5>
                    </div>
                    <div class="card-body">
                        <form action="/products" method="POST">
                            <label>Nombre</label>
                            <input type="text" class="form-control mb-3" name="name" required>
                            <label>Precio</label>
                            <input type="number" step="0.01" class="form-control mb-3" name="price" required>
                            <label>Cantidad</label>
                            <input type="number" class="form-control mb-3" name="quantity" required>
                            <button class="btn btn-primary" type="submit">Guardar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lista de productos -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="text-center">Productos</h5>
                    </div>
                    <div class="card-body">
                        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-3">
                            {% for product in products %}
                            <div class="col">
                                <div class="list-group-item mb-3">
                                    <form action="{{ url_for('edit', product_name=product.name) }}" method="POST">
                                        <input type="text" class="form-control" value="{{ product.name }}" name="name" required>
                                        <small>CANTIDAD</small>
                                        <input type="number" class="form-control" value="{{ product.quantity }}" name="quantity" required>
                                        <small>PRECIO</small>
                                        <input type="number" step="0.01" class="form-control" value="{{ product.price }}" name="price" required>
                                        <button class="btn btn-primary btn-sm mt-3" type="submit">Editar</button>
                                        <a href="{{ url_for('deleteProduct', product_name=product.name) }}" class="btn btn-danger btn-sm mt-3">Eliminar</a>
                                    </form>
                                </div>
                            </div>
                            {% else %}
                            <p class="text-center text-muted">No hay productos todavía.</p>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
